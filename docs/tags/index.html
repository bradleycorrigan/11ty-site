<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>All Tags</title>
    <link rel="stylesheet" href="/style.css">
    <script type="module">
        import mermaid from "https://cdn.jsdelivr.net/npm/mermaid@10/dist/mermaid.esm.min.mjs";
        mermaid.initialize({ startOnLoad: true });

        document.addEventListener("DOMContentLoaded", () => {
            document.querySelectorAll("pre code.language-mermaid").forEach(block => {
                const parent = block.parentNode;
                const graphDef = block.textContent;
                const div = document.createElement("div");
                div.classList.add("mermaid");
                div.textContent = graphDef;
                parent.replaceWith(div);
            });
            mermaid.init();
        });
    </script>
</head>
<body class="light-theme"> <!-- Default theme class -->
    <!-- Sidebar toggle button -->
    <button class="sidebar-toggle" onclick="toggleSidebar()" title="Menu">☰</button>
    <!-- Dark mode toggle button -->
    <button class="dark-mode-toggle" onclick="toggleDarkMode()" title="Toggle dark/light theme">🌓</button>

    <!-- Sidebar -->
    <div class="sidebar collapsed">
        <div class="sidebar-header">
            📖 Menu
        </div>
        <nav>
            <ul>
                <!-- Hardcoded link for the homepage -->
                <li><a href="/">🏡 Home</a></li>
                <li><a href="https://photos.bradleycorrigan.co.uk">📸 Pictures</a></li>
                
                    <li><a href="/posts/week-one-porto/">Week in Porto</a></li>
                
                    <li><a href="/posts/week-two-coimbra/">Week in Coimbra</a></li>
                
                    <li><a href="/posts/python-list-comprehensions/">List Comprehensions</a></li>
                
                    <li><a href="/posts/python-loops/">Loops</a></li>
                
                    <li><a href="/posts/sql-joins/">SQL Joins</a></li>
                
                    <li><a href="/posts/metric-trees/">Metric Trees</a></li>
                
                    <li><a href="/posts/window-functions/">Window Functions</a></li>
                
            </ul>
        </nav>
    </div>

    <!-- Main content -->
    <div class="content collapsed">
        <header>
            <h1>All Tags</h1>
        </header>

        <!-- Tags section (only shows if tags exist) -->
        

        <main>
            
<h1>Browse posts by topic:</h1>


<div class="tag-cloud">

  
  <a href="/tags/sql/" class="tag-link" data-count="2">
    SQL (2)
  </a>

  
  <a href="/tags/data-concepts/" class="tag-link" data-count="1">
    data-concepts (1)
  </a>

  
  <a href="/tags/python/" class="tag-link" data-count="2">
    python (2)
  </a>

  
  <a href="/tags/travel/" class="tag-link" data-count="2">
    travel (2)
  </a>

</div>

<style>
.tag-cloud {
  display: flex;
  flex-wrap: wrap;
  gap: 0.5rem;
  margin-top: 2rem;
}

.tag-link {
  display: inline-block;
  padding: 0.25rem 0.75rem;
  background: #f0f0f0;
  border-radius: 1rem;
  text-decoration: none;
  color: #333;
  font-size: 0.9rem;
  transition: all 0.2s ease;
}

.tag-link:hover {
  background: #007acc;
  color: white;
  transform: translateY(-2px);
}

.tag-link[data-count="1"] { font-size: 0.8rem; }
.tag-link[data-count="2"] { font-size: 0.9rem; }
.tag-link[data-count="3"] { font-size: 1rem; }
.tag-link[data-count^="4"], 
.tag-link[data-count^="5"] { font-size: 1.1rem; }
.tag-link[data-count^="6"], 
.tag-link[data-count^="7"], 
.tag-link[data-count^="8"], 
.tag-link[data-count^="9"] { font-size: 1.2rem; }
</style>
        </main>
    </div>

    <script src="/script.js"></script>
</body>
</html>
